[package]
name = "ridal"
version = "0.5.2"
edition = "2021"
readme = "README.md"
description="Speeding up Ground Penetrating Radar (GPR) processing"
license-file="LICENSE"
repository="https://github.com/erikmannerfelt/ridal"

authors = ["Erik Schytt Mannerfelt"]

[lib]
name = "ridal_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[[bin]]
name = "ridal"
path = "src/main.rs"

[dependencies]
pyo3 = { version = "0.28.3", optional = true}
numpy = { version = "0.28", optional = true }
ndarray = "0.17"   # For base ndarrays
ndarray-stats = "0.7"  # For ndarray statistics
chrono = "0.4"  # Convert timestamps to seconds before epoch
image = "0.24"  # Write images
smartcore = "0.3"  # (Linear) regression packages
noisy_float = "0.2"  # For inputs to ndarray-stats
rayon = "1.10"  # For parallelization of functions
clap = { version = "4.5", features = ["derive"] }
geomorph = "2.0" # UTM zone conversion functions
utm = "0.1"  # More UTM zone conversion functions
glob = "0.3"
parse_duration = "2.1"
num = "0.4"
num-complex = "0.4"
enterpolation = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The level 1 interpretation format (`ridal interp`).
#
# DEVELOPMENT ONLY -- this must not merge as a path dependency. gprinterp is
# a separate repository (github.com/erikmannerfelt/gprinterp) cloned beside
# this one and git-ignored here, so a path dependency builds nowhere except
# a machine that happens to have that clone. Swap it for a git revision once
# the gprinterp branch is pushed:
#
#   gprinterp = { git = "https://github.com/erikmannerfelt/gprinterp", rev = "..." }
#
# and for a published version before the next `cargo publish` of ridal,
# which rejects both path and bare-git dependencies.
gprinterp = { path = "gprinterp" }

# Web server and browser GUI (feature "server"). See tracking issue #115.
axum = { version = "0.8", optional = true }
# "time" is for the render-permit acquisition timeout in routes.rs, which
# turns an overloaded server into a 503 instead of an unbounded queue.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"], optional = true }
minijinja = { version = "2", optional = true }
# Revision and render identities. Not optional: `RevisionId` is shared by
# the server's cache invalidation and `ridal interp`'s level 2 provenance,
# which must agree on the same string for the same file.
blake3 = "1"
walkdir = { version = "2", optional = true }  # Recursive catalog discovery
lru = { version = "0.12", optional = true }  # Wrapped in a byte-bounded cache
webbrowser = { version = "1", optional = true }  # `ridal gui` browser opening
# Project marker/config parsing (`ridal.toml`). Not optional: projects are
# a CLI concept too -- `ridal project init` and interpretation storage must
# work in builds without the server.
toml = "0.8"
# Editing `ridal.toml` in place from the settings page without destroying
# the comments `ridal project init` writes into it. Already present as a
# transitive dependency of `toml`, so this costs no extra compilation.
toml_edit = "0.22"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
netcdf = { version = "0.12", features = ["ndarray"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
netcdf = { version = "0.12", features = ["ndarray", "static"] }



[dev-dependencies]
tempfile = "3.5.0"
temp-env = "0.3.6"
serial_test = "3.2.0"
approx = "0.5.0"
test_retry = "0.1.0"
# Drives the axum Router in-process via ServiceExt::oneshot, so route tests need
# no HTTP client. Browser-facing tests bind a real port and use Chromium instead.
tower = { version = "0.5", features = ["util"] }

[features]
default = ["cli", "python", "server"]
cli = []
python = ["pyo3", "numpy"]
server = [
    "axum",
    "tokio",
    "minijinja",
    "walkdir",
    "lru",
    "webbrowser",
    "tracing",
    "tracing-subscriber",
]
